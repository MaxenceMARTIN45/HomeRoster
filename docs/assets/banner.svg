<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12101f"/>
      <stop offset=".6" stop-color="#1a1540"/>
      <stop offset="1" stop-color="#2a1f73"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".35" r=".6">
      <stop offset="0" stop-color="#7b6dff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7b6dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b6dff"/>
      <stop offset=".55" stop-color="#5b4cf5"/>
      <stop offset="1" stop-color="#3a2fb8"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity=".06"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Logo -->
  <g transform="translate(88 124) scale(.25)">
    <rect width="512" height="512" rx="116" fill="url(#logo)"/>
    <path d="M108 238 256 114l148 124" fill="none" stroke="#fff" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M152 214v156a26 26 0 0 0 26 26h156a26 26 0 0 0 26-26V214" fill="none" stroke="#fff" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="256" cy="258" r="40" fill="#fff"/>
    <path d="M186 396a70 70 0 0 1 140 0z" fill="#fff"/>
  </g>

  <g font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="88" y="356" font-size="96" font-weight="800" fill="#ffffff" letter-spacing="-2">Home<tspan fill="#b3abff">Roster</tspan></text>
    <text x="92" y="414" font-size="30" font-weight="500" fill="#d6d3f5">The people you share your homelab with,</text>
    <text x="92" y="454" font-size="30" font-weight="500" fill="#d6d3f5">managed from one place.</text>

    <!-- Stack chips -->
    <g font-size="17" font-weight="650">
      <g transform="translate(92 500)"><rect width="122" height="38" rx="19" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".14"/><text x="61" y="25" text-anchor="middle" fill="#e9e7ff">WireGuard</text></g>
      <g transform="translate(226 500)"><rect width="208" height="38" rx="19" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".14"/><text x="104" y="25" text-anchor="middle" fill="#e9e7ff">Nginx Proxy Manager</text></g>
      <g transform="translate(446 500)"><rect width="104" height="38" rx="19" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".14"/><text x="52" y="25" text-anchor="middle" fill="#e9e7ff">Jellyfin</text></g>
      <g transform="translate(562 500)"><rect width="100" height="38" rx="19" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".14"/><text x="50" y="25" text-anchor="middle" fill="#e9e7ff">Immich</text></g>
      <g transform="translate(92 548)"><rect width="90" height="38" rx="19" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".14"/><text x="45" y="25" text-anchor="middle" fill="#e9e7ff">Seerr</text></g>
      <g transform="translate(194 548)"><rect width="138" height="38" rx="19" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".14"/><text x="69" y="25" text-anchor="middle" fill="#e9e7ff">Open WebUI</text></g>
      <g transform="translate(344 548)"><rect width="178" height="38" rx="19" fill="#7b6dff" fill-opacity=".28" stroke="#b3abff" stroke-opacity=".5"/><text x="89" y="25" text-anchor="middle" fill="#ffffff">+ any REST API</text></g>
    </g>

    <!-- UI sketch: a roster card -->
    <g transform="translate(772 118)">
      <rect width="420" height="404" rx="30" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="32" y="58" font-size="24" font-weight="750" fill="#ffffff">People</text>
      <text x="32" y="86" font-size="15" fill="#b9b5e6">3 people · 2 online · 5 devices</text>

      <g transform="translate(32 116)">
        <rect width="356" height="78" rx="18" fill="#ffffff" fill-opacity=".06"/>
        <rect x="14" y="16" width="46" height="46" rx="15" fill="#2a2145"/><text x="37" y="46" text-anchor="middle" font-size="17" font-weight="750" fill="#c4b1ff">AL</text>
        <circle cx="57" cy="59" r="7" fill="#34c58c" stroke="#231d4f" stroke-width="3"/>
        <text x="76" y="36" font-size="17" font-weight="700" fill="#ffffff">Alex</text>
        <rect x="76" y="46" width="62" height="20" rx="10" fill="#252146"/><text x="107" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#b3abff">Admin</text>
      </g>
      <g transform="translate(32 206)">
        <rect width="356" height="78" rx="18" fill="#ffffff" fill-opacity=".06"/>
        <rect x="14" y="16" width="46" height="46" rx="15" fill="#10293a"/><text x="37" y="46" text-anchor="middle" font-size="17" font-weight="750" fill="#8fd6fb">SA</text>
        <circle cx="57" cy="59" r="7" fill="#34c58c" stroke="#231d4f" stroke-width="3"/>
        <text x="76" y="36" font-size="17" font-weight="700" fill="#ffffff">Sam</text>
        <rect x="76" y="46" width="66" height="20" rx="10" fill="#2a2145"/><text x="109" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#c4b1ff">Jellyfin</text>
        <rect x="148" y="46" width="56" height="20" rx="10" fill="#222447"/><text x="176" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#b1b3ff">Seerr</text>
        <rect x="210" y="46" width="62" height="20" rx="10" fill="#10293a"/><text x="241" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#8fd6fb">Immich</text>
      </g>
      <g transform="translate(32 296)">
        <rect width="356" height="78" rx="18" fill="#ffffff" fill-opacity=".06"/>
        <rect x="14" y="16" width="46" height="46" rx="15" fill="#0f2c22"/><text x="37" y="46" text-anchor="middle" font-size="17" font-weight="750" fill="#79e2bd">RI</text>
        <circle cx="57" cy="59" r="7" fill="#7d8497" stroke="#231d4f" stroke-width="3"/>
        <text x="76" y="36" font-size="17" font-weight="700" fill="#ffffff">Riley</text>
        <rect x="76" y="46" width="66" height="20" rx="10" fill="#2a2145"/><text x="109" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#c4b1ff">Jellyfin</text>
        <rect x="148" y="46" width="88" height="20" rx="10" fill="#0f2c22"/><text x="192" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#79e2bd">Open WebUI</text>
      </g>
    </g>
  </g>
</svg>
