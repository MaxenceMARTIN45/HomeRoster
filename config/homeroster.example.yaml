# =====================================================================================================
#  HomeRoster configuration
#
#  Copy this file to config/homeroster.yaml and adapt it. Secrets never go here: reference them with
#  ${VARIABLE} and put the values in .env (see .env.example). ${VARIABLE:-default} sets a fallback.
#  Internal URLs are LAN addresses (IP or hostname + port), not the public ones.
# =====================================================================================================

homeroster:
  owner: Alex                 # your first name, shown in the interface and in the e-mails
  domain: example.com         # apps are reached at https://<app id>.<domain> unless "hostname" says otherwise
  language: en                # default interface and e-mail language: en, fr (or any file in src/homeroster/locales)
  default_device: phone       # name of the first VPN device created for a new person
  sync_interval: 300          # seconds between two automatic access syncs
  trusted_proxies:            # reverse proxy IPs allowed to set X-Real-IP (brute-force protection)
    - 192.168.1.10
  session:
    idle_minutes: 30
    max_hours: 12
  # plugins: [my_package.my_connector]   # extra modules registering providers or connectors

# ----------------------------------------------------------------------------------------------- VPN
vpn:
  provider: wgdashboard
  url: http://192.168.1.11:10086
  api_key: ${WG_API_KEY}
  interface: wg0
  dns: 10.8.0.1               # DNS pushed to the devices
  allowed_ips: 10.8.0.0/24    # what the devices route through the tunnel (split tunnel)
  mtu: 1420
  keepalive: 21

# ------------------------------------------------------------------------------------- Reverse proxy
proxy:
  provider: npm
  url: http://192.168.1.10:81
  email: ${NPM_EMAIL}
  password: ${NPM_PASSWORD}
  acl_prefix: homeroster-     # access lists are named <prefix><app id>

# -------------------------------------------------------------------------------------------- E-mail
mail:
  provider: smtp
  host: smtp.gmail.com
  port: 465                   # 465 = TLS, 587 = STARTTLS
  username: ${SMTP_USERNAME}
  password: ${SMTP_PASSWORD}
  from_name: Alex's homelab
  # from_address: homelab@example.com   # default: username
  # admin_email: you@example.com        # alerts and test e-mails; default: from_address

# ---------------------------------------------------------------------------------------------- Apps
#  The key is the app id: it names the access list and is the default subdomain (<id>.<domain>).
#  Optional per app: label, description ({en: ..., fr: ...}), color (violet, indigo, sky, emerald,
#  amber, rose, teal, orange), icon (see static/icons.svg), logo (PNG for the e-mail), hostname,
#  public_url, uses (another app id whose account this app reuses).
apps:
  jellyfin:
    connector: jellyfin
    url: http://192.168.1.20:8096
    api_key: ${JELLYFIN_API_KEY}

  seerr:
    connector: seerr
    url: http://192.168.1.21:5055
    api_key: ${SEERR_API_KEY}
    uses: jellyfin

  immich:
    connector: immich
    url: http://192.168.1.22:2283
    api_key: ${IMMICH_API_KEY}
    # hostname: photos.example.com

  openwebui:
    connector: openwebui
    url: http://192.168.1.23:8080
    api_key: ${OPENWEBUI_API_KEY}
    hostname: ai.example.com
    label: Open WebUI

  # Any app with a user-management REST API can be added without code. Example: Nextcloud.
  # nextcloud:
