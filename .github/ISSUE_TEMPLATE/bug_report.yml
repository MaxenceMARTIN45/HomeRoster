name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! **Remove secrets, domains and IP addresses** from everything you paste.
        Security issues: please use the private advisory form instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected and what you got.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `docker compose logs --tail 100` and of `docker exec homeroster python -m homeroster check`.
      render: text
  - type: input
    id: version
    attributes:
      label: HomeRoster version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: VPN, reverse proxy and app versions involved.
