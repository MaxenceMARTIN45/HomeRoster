[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "homeroster"
version = "1.0.0"
description = "One place to manage the people you share your homelab with: VPN devices, reverse-proxy access and app accounts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["homelab", "self-hosted", "wireguard", "nginx-proxy-manager", "jellyfin", "immich", "user-management"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20",
  "httpx>=0.28,<1",
  "argon2-cffi>=23.1",
  "pyotp>=2.9,<3",
  "segno>=1.6,<2",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
homeroster = "homeroster.__main__:main"

[project.urls]
Homepage = "https://github.com/MaxenceMARTIN45/homeroster"
Issues = "https://github.com/MaxenceMARTIN45/homeroster/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
homeroster = ["locales/*.json", "templates/*.html", "templates/emails/*", "static/*", "static/apps/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731", "B023", "E501"]
"scripts/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["homeroster"]
known-local-folder = ["fakes", "conftest"]
