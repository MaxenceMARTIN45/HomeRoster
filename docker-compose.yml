services:
  homeroster:
    build: .
    image: homeroster:local
    container_name: homeroster
    restart: unless-stopped
    # Host networking: HomeRoster sees the reverse proxy's real IP (brute-force protection)
    # and listens on <host IP>:8000. Only the reverse proxy should be allowed to reach it.
    network_mode: host
    env_file: .env
    volumes:
      - ./config:/config:ro
      - ./data:/data
    # Hardening: read-only filesystem, no privilege at all.
    read_only: true
    tmpfs:
      - /tmp
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
