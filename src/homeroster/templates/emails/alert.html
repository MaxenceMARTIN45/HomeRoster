<!doctype html>
<html lang="{{ lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ subject }}</title></head>
{% set font = "-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" %}
<body style="margin:0;padding:0;background:#f4f5f9;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f5f9;"><tr><td align="center" style="padding:28px 12px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;background:#ffffff;border:1px solid #e2e5ee;border-radius:20px;">
    <tr><td style="padding:26px 28px;">
      <p style="margin:0;font-family:{{ font }};font-size:12px;font-weight:700;color:#5b4cf5;text-transform:uppercase;letter-spacing:.08em;">HomeRoster · {{ owner }}</p>
      <h1 style="margin:10px 0 8px;font-family:{{ font }};font-size:22px;line-height:1.25;font-weight:800;color:#11131a;">{{ subject }}</h1>
      <p style="margin:0;font-family:{{ font }};font-size:15px;line-height:1.55;color:#4b5163;">{{ detail }}</p>
      <p style="margin:18px 0 0;font-family:{{ font }};font-size:13px;color:#8a90a2;">{{ t('alerts.footer') }}</p>
    </td></tr>
  </table>
</td></tr></table>
</body></html>
